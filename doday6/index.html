<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DoDay6 영어 관리 점검</title>
<meta name="description" content="영어학원 원장님을 위한 무료 관리 점검. 객관식, 약 2분이면 우리 학원 맞춤 진단 리포트를 바로 보여드려요.">
<meta property="og:type" content="website">
<meta property="og:title" content="영어학원 원장님을 위한 관리 점검">
<meta property="og:description" content="객관식, 약 2분. 우리 학원 맞춤 진단 리포트를 바로 보여드려요.">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* 레이아웃: 흰 화면 한가운데 질문 하나. 로고는 왼쪽 위, 뒤로 가기는 왼쪽 아래, 장 진행은 아래 가운데. 리포트는 가운데 정렬 한 열. */
:root {
  --bg: #ffffff;
  --ink: #141a24;
  --text: #46536b;
  --muted: #93a0b5;
  --faint: #b6bfcd;
  --line: #eef1f7;
  --dash: #dfe4ee;
  --navy: #1e3a8a;
  --blue: #2563eb;
  --blue-d: #1d4ed8;
  --sky: #38bdf8;
  --soft: #f7fafd;
  --kakao: #fee500;
  --kakao-ink: #191600;
  --grad: linear-gradient(100deg, #1e3a8a 0%, #2563eb 45%, #38bdf8 100%);
  --grad-btn: linear-gradient(100deg, #1e3a8a 0%, #2563eb 55%, #38bdf8 100%);
  --grad-well: linear-gradient(100deg, #eaf1ff 0%, #e2ebfb 50%, #e7f6ff 100%);
  --grad-box: linear-gradient(150deg, #f3f8ff 0%, #eef3fc 55%, #f2fbff 100%);
  --ring: 0 0 0 1px rgba(56,189,248,.3), 0 10px 26px -12px rgba(37,99,235,.45);
  --pill-shadow: 0 0 0 1px rgba(56,189,248,.4), 0 1px 2px rgba(30,58,138,.12), 0 8px 18px -8px rgba(37,99,235,.45);
  --btn-shadow: 0 2px 4px rgba(30,58,138,.18), 0 16px 32px -14px rgba(37,99,235,.7);
  --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ease: cubic-bezier(.22,.75,.25,1);
  --spring: cubic-bezier(.34,1.56,.44,1);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  position: relative; margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; letter-spacing: -0.012em; line-height: 1.6;
  -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input { font-family: inherit; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; border-radius: 12px; }

/* 고정 요소 */
.logo {
  position: absolute; z-index: 4; top: calc(26px + env(safe-area-inset-top, 0px)); left: max(28px, calc(env(safe-area-inset-left, 0px) + 16px));
  font-size: 17px; font-weight: 800; letter-spacing: -0.04em; text-decoration: none; opacity: .5; transition: opacity .25s ease;
  background-image: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--blue);
  background-color: transparent; border: 0; padding: 0; cursor: pointer;
}
.logo:hover { opacity: .85; }
.back {
  position: fixed; z-index: 4; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); left: max(24px, calc(env(safe-area-inset-left, 0px) + 12px));
  display: flex; padding: 8px; border: 0; background: #fff; box-shadow: 0 4px 14px -6px rgba(30,58,138,.25); border-radius: 999px; color: var(--navy); opacity: .7; cursor: pointer;
  transition: opacity .25s ease, transform .3s cubic-bezier(.2,.8,.2,1);
}
.back:hover { opacity: 1; transform: translateX(-4px); }
.dashes {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 5px; align-items: center;
}
.dashes span { width: 14px; height: 3px; border-radius: 999px; background: var(--dash); transition: width .4s var(--ease), background .4s ease; }
.dashes span.done { background: #b9cdf5; }
.dashes span.on { width: 26px; background-image: var(--grad); }
.chap { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--faint); white-space: nowrap; }

/* 화면 */
#stage { min-height: 100vh; min-height: 100svh; display: flex; overflow-x: clip; }
.screen {
  width: 100%; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center;
  padding-block: 96px 128px;
}
.screen.scroll { align-items: flex-start; }
.col { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
.col.wide { max-width: 620px; gap: 46px; }
.in { animation: pageIn .55s var(--ease) both; }
.in.rev { animation-name: pageInRev; }
.out { animation: pageOut .3s ease both; }
.out.rev { animation-name: pageOutRev; }
@keyframes pageIn { from { opacity: 0; transform: translateX(56px); } to { opacity: 1; transform: none; } }
@keyframes pageInRev { from { opacity: 0; transform: translateX(-56px); } to { opacity: 1; transform: none; } }
@keyframes pageOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-56px); } }
@keyframes pageOutRev { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(56px); } }
@keyframes pop { 0% { transform: translateY(10px) scale(.94); } 60% { transform: translateY(-5px) scale(1.03); } 100% { transform: none; } }
@keyframes shimmer { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }

/* 질문 머리 */
.ask { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted); }
.ask .who { color: var(--blue-d); font-size: 15px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; }
.ask.soft .who { color: var(--blue); font-size: 14px; font-weight: 700; opacity: .5; }
.ask .q { color: var(--ink); font-size: 19px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.45; text-wrap: balance; max-width: 420px; }
.ask .help { font-size: 12.5px; font-weight: 500; color: var(--faint); margin-top: 2px; }

/* 하나 고르기: 세로 우물 + 흰 알약 */
.well {
  position: relative; display: flex; flex-direction: column; padding: 6px; border-radius: 22px;
  background-image: var(--grad-well); box-shadow: inset 0 1px 2px rgba(30,58,138,.07), 0 24px 48px -28px rgba(37,99,235,.35);
  min-width: 200px; max-width: 100%;
}
.well .pill { position: absolute; left: 6px; right: 6px; top: 6px; border-radius: 999px; background: #fff; box-shadow: var(--pill-shadow); transition: transform .42s cubic-bezier(.2,.85,.2,1), height .3s ease, opacity .25s ease; opacity: 0; pointer-events: none; }
.well button {
  position: relative; z-index: 1; border: 0; background: transparent; cursor: pointer; padding: 11px 22px;
  font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: #7b8798; border-radius: 999px; text-align: center;
  transition: color .3s ease, transform .4s var(--spring);
}
.well button:hover { color: var(--navy); }
.well button[aria-pressed="true"] { color: var(--blue-d); font-weight: 800; transform: scale(1.04); }

/* 여러 개 고르기: 칩 */
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 420px; }
.chips button {
  border: 0; cursor: pointer; padding: 13px 10px; border-radius: 16px; font-size: 13.5px; font-weight: 600; color: #7b8798; line-height: 1.35; text-align: center; word-break: keep-all;
  background-image: var(--grad-well); box-shadow: inset 0 1px 2px rgba(30,58,138,.06); transition: transform .35s var(--spring), box-shadow .3s ease, color .3s ease, background .3s ease;
}
.chips button:hover { transform: translateY(-2px); color: var(--navy); }
.chips button[aria-pressed="true"] { background: #fff; color: var(--blue-d); font-weight: 800; box-shadow: var(--pill-shadow); }
.chips.colflow { grid-auto-flow: column; grid-template-rows: repeat(2, auto); }
.chips button:last-child:nth-child(odd) { grid-column: 1 / -1; }

/* 입력 */
.inp { position: relative; width: 100%; max-width: 300px; }
.inp input {
  width: 100%; border: 0; border-radius: 999px; padding: 14px 58px 14px 22px; font-size: 15px; font-weight: 600; color: var(--blue-d);
  background-image: var(--grad-well); box-shadow: inset 0 1px 2px rgba(30,58,138,.09);
}
.inp input:focus { outline: none; box-shadow: inset 0 1px 2px rgba(30,58,138,.09), 0 0 0 2px rgba(56,189,248,.45); }
.inp input::placeholder { color: var(--blue-d); opacity: .3; }
.inp .go { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); }

/* 원형 다음 버튼 */
.go {
  width: 38px; height: 38px; border-radius: 999px; border: 0; background: #fff; color: var(--blue); cursor: pointer;
  display: grid; place-items: center; box-shadow: var(--pill-shadow); transition: transform .35s var(--spring), opacity .3s ease;
}
.go:hover { transform: translateX(2px) scale(1.06); }
.inp .go:hover { transform: translateY(-50%) translateX(2px) scale(1.06); }
.go:disabled { opacity: .35; cursor: default; transform: none; }
.inp .go:disabled { transform: translateY(-50%); }
.next { border: 0; background: #eef3fc; box-shadow: 0 0 0 1px rgba(56,189,248,.25); border-radius: 999px; width: 46px; height: 46px; align-items: center; justify-content: center; color: var(--blue); padding: 0; cursor: pointer; display: flex; transition: transform .3s var(--spring), opacity .3s ease, background .25s ease; }
.next:hover { background: #e2ebfb; transform: translateX(4px); }

/* 첫 화면 */
.hero { position: relative; gap: 0; text-align: center; isolation: isolate; }
.hero::before {
  content: ""; position: absolute; z-index: -1; left: 50%; top: 42%; width: 420px; height: 300px; max-width: 110vw; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(56,189,248,.16), rgba(37,99,235,.06) 55%, transparent 100%); pointer-events: none;
}
.hero > * { animation: heroIn .9s var(--ease) both; animation-delay: calc(var(--d, 0) * 90ms); }
@keyframes heroIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero .eyebrow { margin-bottom: 26px; }
.hero .lead { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; color: #a6b0be; margin-bottom: 6px; }
.hero .title-grad { font-size: clamp(36px, 10vw, 46px); letter-spacing: -0.045em; line-height: 1.15; }
.hero .sub { margin: 18px 0 36px; font-size: 14px; line-height: 1.75; color: var(--muted); font-weight: 500; }
.hero .meta { margin-top: 22px; display: flex; align-items: center; gap: 9px; font-size: 11.5px; font-weight: 600; letter-spacing: .01em; color: var(--faint); }
.hero .meta i { width: 3px; height: 3px; border-radius: 999px; background: #cfd6e2; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .16em; color: var(--faint); }
.title-grad {
  font-size: clamp(26px, 6.4vw, 34px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.3; text-wrap: balance;
  background-image: linear-gradient(100deg, #1e3a8a 0%, #2563eb 35%, #38bdf8 55%, #2563eb 75%, #1e3a8a 100%); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--blue-d);
  animation: shimmer 3.6s linear infinite;
}
.cta {
  border: 0; cursor: pointer; padding: 15px 38px; border-radius: 999px; font-size: 14.5px; font-weight: 800; letter-spacing: -0.015em; color: #fdfdff;
  background-image: var(--grad-btn); box-shadow: var(--btn-shadow); transition: transform .35s cubic-bezier(.34,1.4,.44,1), box-shadow .35s ease;
}
.cta:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 0 3px rgba(56,189,248,.45), 0 4px 8px rgba(30,58,138,.22), 0 24px 46px -14px rgba(37,99,235,.85); }
.cta:disabled { opacity: .5; cursor: default; transform: none; }
.hero .cta { background-image: linear-gradient(100deg, #1e3a8a 0%, #2563eb 35%, #38bdf8 55%, #2563eb 75%, #1e3a8a 100%); background-size: 220% 100%; }
.hero .title-grad, .hero .cta { animation: heroIn .9s var(--ease) both, shimmer 3.6s linear infinite; animation-delay: calc(var(--d, 0) * 90ms), 0s; }
.plain { font-size: min(16px, 4.3vw); font-weight: 600; letter-spacing: -0.01em; line-height: 1.55; color: var(--muted); text-wrap: balance; text-align: center; }
.intro { gap: 6px; text-align: center; }
.intro .next { margin-top: 14px; }

/* 리포트 받기 */
.skip { border: 0; background: none; padding: 6px 10px; font-size: 13px; font-weight: 600; color: var(--faint); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.skip:hover { color: var(--blue-d); }

/* 리포트 공통 */
.head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.head .nm { font-size: 15px; font-weight: 500; color: #a6b0be; }
.head .title-grad { font-size: 24px; }

.tiles { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { padding: 16px 10px 14px; border-radius: 14px; background: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.tile b { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; background-image: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--blue-d); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile b small { font-size: 12px; font-weight: 700; }
.tile span { font-size: 11.5px; font-weight: 600; color: #7b8798; line-height: 1.4; }

.sec { width: 100%; display: flex; flex-direction: column; gap: 16px; padding-bottom: 38px; border-bottom: 1px solid var(--line); }
.sec-h { display: flex; align-items: baseline; gap: 10px; }
.sec-h .no { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #c2cad7; }
.sec-h .tt { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
.picks { display: flex; flex-wrap: wrap; gap: 7px; }
.picks span {
  padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: -0.01em;
  background-image: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--blue-d);
  box-shadow: 0 0 0 1px rgba(56,189,248,.35);
}
.paras { display: flex; flex-direction: column; gap: 9px; padding-left: 2px; }
.para { display: flex; align-items: baseline; gap: 9px; }
.para::before { content: ""; width: 5px; height: 5px; border-radius: 999px; flex: none; transform: translateY(-2px); background-image: linear-gradient(140deg, #38bdf8 0%, #2563eb 70%); }
.para span { line-height: 1.75; text-wrap: pretty; font-size: 14.5px; color: var(--text); font-weight: 500; }
.para span strong { color: var(--ink); font-weight: 800; }
.act { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; padding: 17px 19px; border-radius: 14px; background-image: linear-gradient(150deg, #f3f8ff 0%, #eef3fc 100%); box-shadow: inset 0 0 0 1px rgba(37,99,235,.1); }
.act b { font-size: 11.5px; font-weight: 800; letter-spacing: .07em; color: var(--sky); }
.act span { font-size: 14px; line-height: 1.75; color: var(--text); text-wrap: pretty; }
.act span strong { color: var(--blue-d); font-weight: 800; }
.verdict { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px 22px; border-radius: 18px; background: #fff; box-shadow: var(--ring); text-align: center; }
.verdict small { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--sky); margin-bottom: 2px; }
.verdict p { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.65; letter-spacing: -0.02em; color: var(--ink); text-wrap: balance; }
.verdict p em { font-style: normal; font-weight: 800; color: var(--blue-d); }
.verdict .note { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 4px; }

.todo { width: 100%; display: flex; flex-direction: column; gap: 16px; padding: 26px 26px 28px; border-radius: 20px; background-image: var(--grad-box); box-shadow: inset 0 0 0 1px rgba(37,99,235,.1); }
.todo h3 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: var(--blue-d); }
.todo ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.todo li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.65; color: var(--text); }
.todo li::before { content: ""; margin-top: 7px; width: 7px; height: 7px; border-radius: 999px; flex: none; background-image: linear-gradient(140deg, #38bdf8 0%, #2563eb 60%, #1e3a8a 100%); }

.closing { font-size: 13.5px; font-weight: 500; line-height: 1.8; color: #7b8798; text-align: center; text-wrap: balance; }
.closing b { color: var(--blue-d); font-weight: 700; }

/* 체험 신청 */
.trial { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 34px 22px 30px; border-radius: 26px; background-image: var(--grad-box); box-shadow: inset 0 0 0 1px rgba(37,99,235,.1), 0 30px 60px -40px rgba(37,99,235,.45); text-align: center; }
.trial .title-grad { font-size: clamp(22px, 5.6vw, 26px); }
.trial .desc { font-size: 13.5px; color: var(--text); line-height: 1.75; max-width: 420px; text-wrap: balance; }
.seats p { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.seats p b { color: var(--blue-d); font-weight: 800; font-size: 15px; }
.form { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.form .fixed { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
.form .fixed span { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--blue-d); background: #fff; box-shadow: 0 0 0 1px rgba(56,189,248,.35); }
.form .inp { max-width: none; }
.form .inp input { padding-right: 22px; background: #fff; box-shadow: 0 0 0 1px rgba(56,189,248,.3); }
.form .inp input:focus { box-shadow: 0 0 0 2px rgba(56,189,248,.6); }
.agree { display: flex; gap: 9px; align-items: flex-start; text-align: left; font-size: 12px; line-height: 1.6; color: #7b8798; cursor: pointer; padding-inline: 4px; max-width: 340px; }
.agree input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--blue); flex: none; }
.agree a { color: var(--blue-d); }
.err { margin: 0; min-height: 1.2em; font-size: 12.5px; font-weight: 600; color: var(--blue-d); }
.done { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.done .ok { width: 52px; height: 52px; border-radius: 999px; display: grid; place-items: center; background-image: var(--grad-btn); box-shadow: var(--btn-shadow); animation: pop .6s var(--ease) both; }
.done h3 { margin: 6px 0 0; font-size: 19px; font-weight: 800; letter-spacing: -0.025em; color: var(--ink); }
.done p { margin: 0; font-size: 13.5px; color: var(--muted); font-weight: 500; }
.done .look { margin-top: 18px; font-size: 13.5px; color: var(--text); }
.kakao {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 14px 28px; border-radius: 999px; text-decoration: none;
  font-size: 14.5px; font-weight: 800; letter-spacing: -0.015em; color: var(--kakao-ink); background: var(--kakao); box-shadow: 0 10px 24px -14px rgba(25,22,0,.6);
  transition: transform .35s cubic-bezier(.34,1.4,.44,1);
}
.kakao:hover { transform: translateY(-2px); }
.peek { font-size: 12.5px; font-weight: 600; color: var(--faint); text-decoration: none; }
.peek:hover { color: var(--blue-d); }

@media (max-width: 520px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .screen { padding-block: 88px 120px; }
  .logo { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .in, .out, .done .ok { animation: none; }
  .title-grad, .hero .cta, .hero > * { animation: none; }
}
</style>
</head>
<body>

<button class="logo" id="logo" type="button" aria-label="처음으로">DoDay6</button>
<main id="stage" aria-live="polite"></main>
<button class="back" id="back" type="button" aria-label="이전" hidden>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<div class="chap" id="chap" hidden></div>

    TOTAL_SEATS: 10,

  const TALK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-5.25 0-9.5 3.3-9.5 7.38 0 2.62 1.76 4.92 4.4 6.23l-.9 3.3c-.08.3.26.54.52.37l3.9-2.58c.52.06 1.05.1 1.58.1 5.25 0 9.5-3.31 9.5-7.4S17.25 3.5 12 3.5Z"/></svg>';

  // ---------- 질문 ----------
  const CH = ["", "우리 학원", "도구와 학부모 소통", "숙제와 테스트", "원장님 생각", "도입 계획"];

  const STUDENTS = { "30명 이하": 20, "31~60명": 45, "61~100명": 80, "101~150명": 125, "151명 이상": 180 };

  const R_WEEK = { "1시간 이하": 45, "1~3시간": 120, "3~5시간": 240, "5시간 이상": 330 };    // 일주일 분
  const FREE_COST = "학원 부담 없음 (학부모 결제)";
  const UNKNOWN_COST = "잘 모르겠어요";
  const COST = { [FREE_COST]: 0, "5만 원 이하": 3, "5~10만 원": 7.5, "10~20만 원": 15, "20만 원 이상": 25, [UNKNOWN_COST]: null };   // 만 원
  const TOOLS = ["단어 앱·프로그램", "문법 프로그램", "원서 읽기 프로그램", "레벨테스트 프로그램", "출결 관리 프로그램", "학부모 알림 서비스"];
  const NONE_TOOL = "따로 쓰는 프로그램 없음";
  const NONE_HW = "따로 안 내요";
  const NONE_FIX = "따로 하지 않아요";
  const NONE_WORRY = "특별히 없어요";
  const DIRECT = "문자·카톡으로 직접 보내요", AUTO = "프로그램에서 자동으로 나가요", MEET = "상담할 때만 말씀드려요", NO_REPORT = "따로 알리지 않아요";
  const TIMING = { "이번 주부터 바로": 5, "이번 달 안에": 4, "다음 달부터": 3, "신학기(1~2월)부터": 2, "먼저 자세히 보고 정할게요": 1 };
  const MISS = ["0~1명", "2~3명", "4~5명", "6명 이상"];
  const PAPER = "종이 시험을 보고 직접 채점해요", NO_LTEST = "따로 하지 않아요";
  const WORRY_ANS = {
    "기존 자료를 옮기는 일": "체험 기간에는 지금 쓰시는 프로그램을 그대로 두고 <strong>함께</strong> 써보실 수 있어요.",
    "선생님·학생이 적응하는 것": "원장님과 선생님은 <strong>폰으로</strong> 관리하고, 학생은 보상과 주간 순위로 매일 들어올 이유가 생겨요.",
    "학부모님 반응": "학부모님은 앱을 깔지 않고 <strong>카톡 알림톡</strong>으로 받으세요. 새로 배우실 것이 없어요.",
    "비용이 늘어나는 것": `체험 ${CONFIG.TRIAL}은 무료이고, 알림톡 발송비는 <strong>기본료에 포함</strong>돼 있어요.`,
    "써보다 흐지부지될까 봐": "체험이 끝난 뒤 이어서 쓸지는 <strong>원장님이 정하시면</strong> 돼요."
  };

  // skip이 참이면 그 질문은 건너뛴다.
  const Q = [
    { id: "type", ch: 1, title: "학원 형태를 골라주세요", kind: "single",
      opts: ["영어 전문 학원", "종합 학원 (영어 포함)", "공부방", "교습소"] },
    { id: "grade", ch: 1, title: "가장 많은 학년은 어디인가요?", help: "최대 3개까지 고를 수 있어요", kind: "multi", max: 3, flow: "col",
      opts: ["초등 저학년", "초등 고학년", "중등", "고등"] },
    { id: "students", ch: 1, title: "지금 재원생은 몇 명인가요?", kind: "single",
      opts: Object.keys(STUDENTS) },
    { id: "staff", ch: 1, title: "수업하시는 선생님은 원장님 포함 몇 분이세요?", kind: "single",
      opts: ["원장님 혼자", "2~3명", "4명 이상"] },

    { id: "tools", ch: 2, title: "지금 쓰는 프로그램을 모두 골라주세요", help: "쓰고 있는 건 전부 눌러주세요", kind: "multi",
      opts: [...TOOLS, NONE_TOOL], exclusive: NONE_TOOL },
    { id: "cost", ch: 2, title: "고르신 프로그램 비용을 모두 합치면 한 달에 얼마쯤인가요?", help: "대략으로 골라주셔도 괜찮아요", kind: "single",
      opts: Object.keys(COST), skip: () => !toolCount(A.tools) },
    { id: "report", ch: 2, title: "학부모님께 학습 상황은 어떻게 알리세요?", kind: "single",
      opts: [DIRECT, AUTO, MEET, NO_REPORT] },
    { id: "rweek", ch: 2, title: "학부모님 문자에 일주일에 시간이 얼마나 드세요?", kind: "single",
      opts: Object.keys(R_WEEK), skip: () => A.report !== DIRECT },

    { id: "hw", ch: 3, title: "숙제는 어떻게 내세요?", help: "내는 방식을 모두 눌러주세요", kind: "multi",
      opts: ["교재·워크북", "프린트", "단어 외우기", "프로그램·앱", "원서 읽기", NONE_HW], exclusive: NONE_HW },
    { id: "miss", ch: 3, title: "숙제를 못 해 오는 학생은 10명 중 몇 명쯤인가요?", kind: "single",
      opts: MISS, skip: () => noHomework() },
    { id: "hwfix", ch: 3, title: "숙제를 못 해 오면 어떻게 하세요?", help: "하고 계신 걸 모두 눌러주세요", kind: "multi",
      opts: ["학원에 남겨서 하게 해요", "학부모님께 연락드려요", "다음 수업에 다시 내요", "벌점이나 보상으로 관리해요", NONE_FIX], exclusive: NONE_FIX,
      skip: () => noHomework() },
    { id: "tgrade", ch: 3, title: "단어 시험, 숙제, 레벨테스트를 채점하고 확인하는 데 하루 몇 분 쓰세요?", kind: "single",
      opts: Object.keys(T_GRADE) },
    { id: "ltest", ch: 3, title: "상담 오는 학생의 레벨테스트는 어떻게 하세요?", kind: "single",
      opts: [PAPER, "프로그램으로 시험을 봐요", "면담이나 구두로 판단해요", NO_LTEST] },

    { id: "satisfy", ch: 4, title: "지금 학생 관리 방식, 원장님 마음에 드세요?", kind: "single",
      opts: ["지금 그대로가 좋아요", "대체로 괜찮아요", "괜찮은데 손이 많이 가요", "바꾸고 싶은 부분이 있어요", "새 방식을 찾고 있어요"] },
    { id: "worry", ch: 4, title: "새 프로그램을 쓴다면 어떤 게 가장 마음에 걸리세요?", help: "최대 2개까지 고를 수 있어요", kind: "multi", max: 2,
      opts: [...Object.keys(WORRY_ANS), NONE_WORRY], exclusive: NONE_WORRY },

    { id: "decider", ch: 5, title: "새 프로그램은 보통 누가 정하세요?", kind: "single",
      opts: ["제가 직접 정해요", "선생님들과 의견을 나눠 정해요", "대표님·본사와 함께 정해요"] },
    // 비교해 볼 것을 전제로, 언제부터인지만 묻는다
    { id: "timing", ch: 5, kind: "single",
      title: () => `${toolCount(A.tools) ? "지금 쓰시는 프로그램과" : "지금 방식과"} 무료로 비교해 볼 수 있다면, 언제부터 가능하세요?`,
      opts: Object.keys(TIMING) }
  ];

  // ---------- 파일럿 우선순위 점수 (시트에만 저장, 화면에는 안 보임) ----------
  // 최대 24점. 16점 이상 A(우선 연락), 11~15점 B, 10점 이하 C. README.md에 기준표가 있습니다.
  const SCORE = {
    students: { "30명 이하": 1, "31~60명": 3, "61~100명": 3, "101~150명": 1, "151명 이상": 0 },
    staff: { "원장님 혼자": 3, "2~3명": 2, "4명 이상": 0 },
    decider: { "제가 직접 정해요": 3, "선생님들과 의견을 나눠 정해요": 2, "대표님·본사와 함께 정해요": 0 },
    timing: TIMING,
    satisfy: { "새 방식을 찾고 있어요": 2, "바꾸고 싶은 부분이 있어요": 2, "괜찮은데 손이 많이 가요": 1, "대체로 괜찮아요": 0, "지금 그대로가 좋아요": 0 }
  };
  function pilotScore() {
    let s = 0;
    Object.keys(SCORE).forEach(k => { s += SCORE[k][A[k]] || 0; });
    if (A.report && A.report !== AUTO) s += 1;
    if ((T_GRADE[A.tgrade] || 0) >= 90) s += 1;
    if (A.miss && A.miss !== MISS[0]) s += 1;
    if ((A.worry || []).includes(NONE_WORRY)) s += 1;
    if (phone && agreed) s += 1;
    if (submitted && !submitted.waitlist) s += 3;
    return { score: s, grade: s >= 16 ? "A" : s >= 11 ? "B" : "C" };
  }

  // ---------- 상태 ----------
  const STORE_KEY = "dd6-check-v5";
  let A = {};
  let name = "", dong = "", owner = "", phone = "", agreed = false;
  let submitted = null;
  let sid = "";
  let src = {};
  let step = 0;       // 0 첫 화면, 1 안내, 2 학원 이름, 3 동, 4.. 질문, CONTACT 리포트 받기, R 리포트
  const FIRST_Q = 4;
  const CONTACT = FIRST_Q + Q.length;
  const R = CONTACT + 1;

  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (s && typeof s === "object") {
      A = s.A || {}; name = s.name || ""; dong = s.dong || ""; owner = s.owner || ""; phone = s.phone || "";
      agreed = !!s.agreed; submitted = s.submitted || null; sid = s.sid || ""; src = s.src || {};
    }
  } catch (e) {}
  if (!sid) sid = newId();
  // 광고 유입 경로: 처음 들어온 주소의 utm 값을 기억한다
  try {
    const p = new URLSearchParams(location.search);
    const u = { source: p.get("utm_source"), medium: p.get("utm_medium"), campaign: p.get("utm_campaign") };
    if (u.source || u.medium || u.campaign) src = u;
    if (!src.referrer && document.referrer) src.referrer = document.referrer.slice(0, 200);
  } catch (e) {}
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ A, name, dong, owner, phone, agreed, submitted, sid, src })); } catch (e) {} }
  function newId() {
    try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  // ---------- 계산 ----------
  function toolCount(a) { return (a || []).filter(x => x !== NONE_TOOL).length; }
  function noHomework() { const h = A.hw || []; return h.length === 1 && h[0] === NONE_HW; }
  function timeCalc() {
    const grade = T_GRADE[A.tgrade] || 0;
    const week = A.report === DIRECT ? (R_WEEK[A.rweek] || 0) : 0;
    const reportMonth = Math.round(week * 4.3);
    const month = Math.round((grade * 22 + reportMonth) / 60);
    return { grade, reportMonth, month, year: month * 12 };
  }
  function costCalc() {
    const v = COST[A.cost];
    const students = STUDENTS[A.students] || 0;
    const total = v || 0;
    return { total, free: v === 0, unknown: v === null, per: students && total ? total * 10000 / students : 0 };
  }
  function won(n) { return (Math.round(n / 100) * 100).toLocaleString("ko-KR") + "원"; }
  function man(v) { return (Math.round(v * 10) / 10).toLocaleString("ko-KR"); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
  function who() { return name ? esc(name) : "원장님 학원"; }
  // 받침이 있으면 a, 없으면 b
  function josa(w, a, b) { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? a : b; }
  function fmtPhone(v) {
    let d = v.replace(/\D/g, "");
    if (d.startsWith("02")) {
      d = d.slice(0, 10);
      if (d.length < 3) return d;
      if (d.length < 6) return `${d.slice(0, 2)}-${d.slice(2)}`;
      if (d.length < 10) return `${d.slice(0, 2)}-${d.slice(2, 5)}-${d.slice(5)}`;
      return `${d.slice(0, 2)}-${d.slice(2, 6)}-${d.slice(6)}`;
    }
    d = d.slice(0, 11);
    if (d.length < 4) return d;
    if (d.length < 8) return `${d.slice(0, 3)}-${d.slice(3)}`;
    if (d.startsWith("01") || d.length === 11) return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
    return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
  }
  function phoneOk(v) { return v.replace(/\D/g, "").length >= 9; }
  const reduce = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();

  // ---------- 구글 시트로 보내기 ----------
  // 같은 sid는 시트에서 한 줄로 합쳐진다 (report → lead → applied 순으로 단계가 올라감).
  function record(stage) {
    const t = timeCalc(), c = costCalc(), p = pilotScore();
    const list = k => (A[k] || []).join(", ");
    return {
      sid, stage, academy: name, dong, owner, phone: agreed ? phone : "", agreed: agreed ? "예" : "",
      score: p.score, grade: p.grade,
      type: A.type, grades: list("grade"), students: A.students, staff: A.staff,
      tools: list("tools"), cost: A.cost, report: A.report, rweek: A.rweek,
      hw: list("hw"), miss: A.miss, hwfix: list("hwfix"), tgrade: A.tgrade, ltest: A.ltest,
      satisfy: A.satisfy, worry: list("worry"), decider: A.decider, timing: A.timing,
      hoursPerMonth: t.month, costPerStudent: c.per ? Math.round(c.per) : "",
      waitlist: submitted && submitted.waitlist ? "예" : "",
      utm_source: src.source, utm_medium: src.medium, utm_campaign: src.campaign, referrer: src.referrer,
      kst: new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" })
    };
  }
  async function send(stage) {
    if (!CONFIG.SHEET_URL) return false;
    const body = JSON.stringify(record(stage));
    const opt = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, keepalive: true };
    try {
      const r = await fetch(CONFIG.SHEET_URL, opt);
      const j = await r.json();
      return !!(j && j.ok);
    } catch (e) {
      // 응답을 읽지 못하는 환경(CORS)이면 한 번 더 보내고, 보내진 것으로 본다. 시트에서 sid로 합쳐지므로 중복되지 않는다.
      try { await fetch(CONFIG.SHEET_URL, { ...opt, mode: "no-cors" }); return true; } catch (e2) { return false; }
    }
  }
  function stageNow() { return submitted ? "applied" : (phone && agreed) ? "lead" : "report"; }

  // ---------- 화면 전환 ----------
  const stage = document.getElementById("stage");
  const backBtn = document.getElementById("back");
  const dashes = document.getElementById("dashes");
  const chap = document.getElementById("chap");
  let busy = false, goBack = false, placeCurrent = null;

  function go(n) {
    if (busy) return;
    goBack = n < step;
    const cur = stage.firstElementChild;
    const swap = () => { step = n; save(); render(); window.scrollTo(0, 0); busy = false; };
    if (!cur || reduce) return swap();
    busy = true;
    cur.classList.remove("in", "rev"); cur.classList.add("out"); if (goBack) cur.classList.add("rev");
    setTimeout(swap, 300);
  }
  function isOn(q) { return !q.skip || !q.skip(); }
  // 다음 화면. 건너뛰는 질문의 예전 답은 지운다.
  function nextStep(s) {
    let n = s + 1;
    while (n >= FIRST_Q && n < CONTACT && !isOn(Q[n - FIRST_Q])) { delete A[Q[n - FIRST_Q].id]; n++; }
    return n;
  }
  function prevStep(s) {
    let n = s - 1;
    while (n >= FIRST_Q && n < CONTACT && !isOn(Q[n - FIRST_Q])) n--;
    return n;
  }
  // 로고: 답과 신청 상태를 모두 지우고 첫 화면으로 (중간이면 먼저 묻는다)
  document.getElementById("logo").onclick = () => {
    A = {}; name = ""; dong = ""; owner = ""; phone = ""; agreed = false; submitted = null; sid = newId(); go(0);
  };
  backBtn.onclick = () => { if (step > 0) go(prevStep(step)); };

  function chrome() {
    backBtn.hidden = step === 0;
    const qi = step - FIRST_Q;
    const inQ = qi >= 0 && qi < Q.length;
    dashes.hidden = chap.hidden = !inQ;
    if (inQ) {
      const c = Q[qi].ch;
      dashes.innerHTML = CH.slice(1).map((_, i) => `<span class="${i + 1 === c ? "on" : i + 1 < c ? "done" : ""}"></span>`).join("");
      chap.textContent = `${c}장 ${CH[c]}`;
    }
  }
  function mount(html, cls) {
    placeCurrent = null;
    stage.innerHTML = `<section class="screen in ${goBack ? "rev" : ""} ${cls || ""}">${html}</section>`;
    chrome();
  }
  function render() {
    if (step === 0) return renderHero();
    if (step === 1) return renderIntro();
    if (step === 2) return renderText("name");
    if (step === 3) return renderText("dong");
    if (step === CONTACT) return renderContact();
    if (step === R) return renderReport();
    return renderQ(Q[step - FIRST_Q], step - FIRST_Q);

  // ---------- 질문 ----------
  function renderQ(q, qi) {
    const isMulti = q.kind === "multi";
    const title = typeof q.title === "function" ? q.title() : q.title;
    const opts = q.opts;
    const btns = opts.map((o, i) => `<button type="button" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("");
    let control = "";
    if (q.kind === "single") control = `<div class="well" role="group" aria-label="${esc(title)}"><span class="pill"></span>${btns}</div>`;
    else control = `<div class="chips${q.flow === "col" ? " colflow" : ""}" role="group" aria-label="${esc(title)}">${btns}</div>`;
    mount(`
      <div class="col">
        <div class="ask"><span class="who">${who()}</span><span class="q">${esc(title)}</span>${q.help ? `<span class="help">${esc(q.help)}</span>` : ""}</div>
        ${control}
        <button class="next" id="next" type="button" aria-label="다음 질문" style="visibility:hidden">${ARROW}</button>
      </div>`);

    const nx = document.getElementById("next");
    let leaving = false;

    function placePill() {
      const wrap = stage.querySelector(".well");
      if (!wrap) return;
      const pill = wrap.querySelector(".pill");
      const on = wrap.querySelector('button[aria-pressed="true"]');
      if (!on) { pill.style.opacity = "0"; return; }
      const first = pill.style.opacity !== "1";
      if (first) pill.style.transition = "none";
      pill.style.height = on.offsetHeight + "px";
      pill.style.transform = `translateY(${on.offsetTop - 6}px)`;
      if (first) { void pill.offsetHeight; pill.style.transition = ""; }
      pill.style.opacity = "1";
    }
    function refresh() {
      const v = A[q.id];
      const has = isMulti ? (v && v.length) : v != null;
      nx.style.visibility = has ? "visible" : "hidden";
      stage.querySelectorAll("button[data-i]").forEach(b => {
        const o = opts[+b.dataset.i];
        b.setAttribute("aria-pressed", String(isMulti ? (v || []).includes(o) : v === o));
      });
      placePill();
    }
    stage.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.i];
      if (isMulti) {
        let cur = (A[q.id] || []).slice();
        if (cur.includes(o)) cur = cur.filter(x => x !== o);
        else if (q.exclusive && o === q.exclusive) cur = [o];
        else {
          cur = cur.filter(x => x !== q.exclusive);
          if (q.max && cur.length >= q.max) cur.shift();
          cur.push(o);
        }
        A[q.id] = cur;
        save(); refresh();
        return;
      }
      A[q.id] = o;
      save(); refresh();
      // 하나 고르는 질문은 알약이 미끄러진 뒤 바로 다음으로
      if (!leaving) { leaving = true; setTimeout(() => go(nextStep(step)), reduce ? 0 : 380); }
    });
    nx.onclick = () => go(nextStep(step));
    refresh();
    placeCurrent = placePill;
    requestAnimationFrame(placePill);
  }

    const left = seats ? Math.max(0, CONFIG.TOTAL_SEATS - seats.taken) : null;

    if (submitted) {
      box.innerHTML = `<div class="done"><span class="ok">${CHECK}</span>
        <h3>${submitted.waitlist ? "대기 신청이 접수됐어요" : "체험 신청이 접수됐어요"}</h3>
        <p>${esc(submitted.phone)} 번호로 ${CONFIG.CALL_DAYS}일 안에 연락드릴게요.</p>
        ${CONFIG.KAKAO_URL ? `<p class="look">궁금한 점은 카톡 채널로 먼저 물어보셔도 돼요.</p>${kakaoBtn("카톡 채널로 이야기하기")}` : ""}
        <a class="peek" style="margin-top:14px" href="${esc(CONFIG.HOME_URL)}" target="_blank" rel="noopener">DoDay6 홈페이지 둘러보기</a></div>`;
      return;
    }
    box.innerHTML = `
      <div class="eyebrow">FREE TRIAL</div>
      <div class="title-grad">${full ? "이번 체험은 모두 찼어요" : `선착순 ${CONFIG.TOTAL_SEATS}개 학원,<br>${esc(CONFIG.TRIAL)} 무료로 함께해요`}</div>
      ${full ? `<div class="desc">대기 신청을 남겨주시면 자리가 나는 순서대로 연락드릴게요.</div>`
        : `<div class="desc">${toolCount(A.tools) ? "지금 쓰시는 프로그램과 나란히 두고, 원장님 학원에서 직접 비교해 보세요." : "지금 하시는 방식은 그대로 두고, 원장님 학원에서 직접 써보세요."}</div>${left != null ? `<div class="seats"><p>남은 자리 <b>${left}</b> / ${CONFIG.TOTAL_SEATS}</p></div>` : ""}`}
      <form class="form" id="apply" novalidate>
        <div class="fixed"><span>${esc(name || "학원 이름 없음")}${dong ? " · " + esc(dong) : ""}</span><span>재원생 ${esc(A.students || "-")}</span></div>
        <div class="inp"><input id="owner" maxlength="20" autocomplete="name" placeholder="원장님 성함 (선택)" aria-label="원장님 성함 (선택)" value="${esc(owner)}"></div>
        <div class="inp"><input id="phone" type="tel" inputmode="tel" maxlength="13" placeholder="연락받으실 번호" autocomplete="tel" aria-label="연락받으실 번호" value="${esc(phone)}"></div>
        <label class="agree" for="agree"><input type="checkbox" id="agree" ${agreed ? "checked" : ""}><span>${consentText(true)}</span></label>
        <p class="err" id="err" role="alert"></p>
        <button class="cta" id="send" type="submit">${full ? "대기 신청하기" : `${esc(CONFIG.TRIAL)} 무료 체험 신청하기`}</button>
        <div id="alt"></div>
      </form>`;

    const phoneEl = document.getElementById("phone");
    phoneEl.oninput = () => { phoneEl.value = fmtPhone(phoneEl.value); };

    document.getElementById("apply").onsubmit = async e => {
      e.preventDefault();
      const ow = document.getElementById("owner").value.trim();
      const ph = phoneEl.value.trim();
      const agree = document.getElementById("agree").checked;
      const err = document.getElementById("err");
      if (!phoneOk(ph)) { err.textContent = "연락받으실 번호를 숫자로 적어주세요. 예: 010-1234-5678"; return; }
      if (!agree) { err.textContent = "연락을 위한 정보 수집에 동의해 주셔야 신청할 수 있어요."; return; }
      err.textContent = "";
      const btn = document.getElementById("send");
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = "보내는 중";
      owner = ow; phone = ph; agreed = true;
      submitted = { phone: ph, waitlist: full };
      const ok = await send("applied");
      if (!ok) {
        submitted = null;
        btn.disabled = false; btn.textContent = label;
        err.textContent = "지금은 신청이 전송되지 않았어요. 잠시 뒤 다시 눌러주세요.";
        document.getElementById("alt").innerHTML = kakaoBtn("카톡 채널로 바로 신청하기");
        save();
        return;
      }
      save(); renderTrial();
    };
  }

  async function loadSeats() {
    if (!CONFIG.SHEET_URL) return;
    try {
      const r = await fetch(CONFIG.SHEET_URL + (CONFIG.SHEET_URL.includes("?") ? "&" : "?") + "action=seats");
      const j = await r.json();
      if (j && typeof j.taken === "number") { seats = { taken: j.taken }; if (step === R) renderTrial(); }
    } catch (e) {}
  }

  addEventListener("resize", () => { if (placeCurrent) requestAnimationFrame(placeCurrent); });

  // ---------- 시작 ----------
  save();
  render();
  loadSeats();
})();
</script>
</body>
</html>
